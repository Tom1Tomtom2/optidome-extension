<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>optidome</title>
    <style>
      /* Onest, the website's font, served by the extension (OFL, fonts/OFL-onest.txt). */
      @font-face {
        font-family: "Onest";
        font-weight: 100 900;
        font-display: swap;
        src: url("fonts/onest-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Onest";
        font-weight: 100 900;
        font-display: swap;
        src: url("fonts/onest-latin-ext-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --soft-bg: #f7f7f5;
        --ink: #131312;
        --ink-2: #2e2d2a;
        --muted: #5a5955;
        --line: #ecebe8;
        --line-strong: #d9d8d3;
        --badge: #fff1e6;
        --icon: #b54d00;
        --button: #131312;
        --button-text: #ffffff;
        --dome: #131312;
        --dome-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1d;
          --soft-bg: #26262a;
          --ink: #ecebe8;
          --ink-2: #d6d5cf;
          --muted: #a9a8a2;
          --line: #38383e;
          --line-strong: #45454c;
          --badge: rgba(255, 109, 0, 0.16);
          --icon: #ff9a4d;
          --button: #ffffff;
          --button-text: #131312;
          --dome: #ffffff;
          --dome-text: #131312;
        }
      }
      body {
        width: 380px;
        margin: 0;
        padding: 18px 18px 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: var(--bg);
        color: var(--ink);
        font: 13.5px/1.5 "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand {
        flex-grow: 1;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .month {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        background: var(--soft-bg);
        padding: 5px 10px;
        border-radius: 999px;
      }
      .category {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .grade-block {
        background: var(--soft-bg);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .grade-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .grade-dome {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .letter {
        width: 68px;
        height: 58px;
        box-sizing: border-box;
        padding-bottom: 6px;
        border-radius: 34px 34px 6px 6px;
        background: var(--dome);
        color: var(--dome-text);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        line-height: 1;
      }
      .underline {
        width: 78px;
        height: 6px;
        border-radius: 999px;
        background: #ff6d00;
      }
      .label {
        font-size: 18px;
        font-weight: 600;
      }
      .sentence {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.4;
        color: var(--ink-2);
      }
      .scale {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }
      .scale div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      .scale strong {
        width: 100%;
        padding: 5px 0;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        font-size: 13px;
        font-weight: 600;
      }
      .scale .current {
        color: var(--ink);
        font-weight: 600;
      }
      .scale .current strong {
        background: #ff6d00;
        border-color: #ff6d00;
        color: #131312;
        font-weight: 700;
      }
      .explainer {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .next-step {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--bg);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.45;
      }
      .next-step svg {
        flex-shrink: 0;
        margin-top: 1px;
        color: var(--icon);
      }
      .list,
      .usage {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cost {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.45;
      }
      .cost strong {
        font-variant-numeric: tabular-nums;
      }
      .calc {
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      .calc summary {
        cursor: pointer;
        color: var(--icon);
        font-weight: 500;
      }
      .calc p {
        margin: 6px 0 0;
      }
      .habit {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .habit .check {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--badge);
        color: var(--icon);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .habit span:nth-child(2) {
        flex-grow: 1;
      }
      .habit strong {
        font-variant-numeric: tabular-nums;
      }
      .empty {
        margin: 0;
        color: var(--muted);
      }
      .tip {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tip p {
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #ff6d00;
        outline-offset: 2px;
      }
      .primary {
        border: none;
        background: var(--button);
        color: var(--button-text);
        font-size: 14px;
        font-weight: 600;
        padding: 12px 16px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .footer span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .link {
        border: none;
        background: none;
        padding: 0;
        color: var(--icon);
        font-size: 12px;
        font-weight: 500;
      }
      .data {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .data p {
        margin: 0;
      }
      .data div {
        display: flex;
        gap: 8px;
      }
      .secondary {
        flex: 1;
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--ink);
        font-size: 13px;
        padding: 7px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <svg width="24" height="24" id="logo" aria-hidden="true"></svg>
      <span class="brand">optidome</span>
      <span class="month" id="month"></span>
    </div>

    <section class="grade-block">
      <span class="category" data-i18n="monthUsage"></span>
      <div id="with-grade" hidden>
        <div class="grade-row">
          <div class="grade-dome">
            <div class="letter" id="letter"></div>
            <div class="underline"></div>
          </div>
          <div>
            <div class="label" id="label"></div>
            <p class="sentence" id="sentence"></p>
          </div>
        </div>
      </div>
      <p class="sentence" id="no-grade" data-i18n="noGradeYet" hidden></p>
      <div class="scale" id="scale"></div>
      <p class="explainer" data-i18n="pedagogy"></p>
      <div class="next-step">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.5V3M3.5 7.5 8 3l4.5 4.5"></path></svg>
        <span id="next-step"></span>
      </div>
      <details class="calc">
        <summary data-i18n="howGradeCalculated"></summary>
        <p data-i18n="gradeExplain"></p>
      </details>
    </section>

    <section class="usage">
      <p class="cost">
        <strong id="messages">0</strong> <span id="messages-label"></span>
        <span data-i18n="wordIn"></span> <strong id="conversations">0</strong> <span id="conversations-label"></span>
        <span data-i18n="thisMonth"></span>
      </p>
      <p class="cost" id="cost" hidden></p>
      <details class="calc" id="calc" hidden>
        <summary data-i18n="howCalculated"></summary>
        <p id="calc-text"></p>
      </details>
    </section>

    <!-- Right under the figures: the share button stays visible without scrolling. -->
    <button class="primary" id="share" type="button">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2M5 4.5 8 1.5l3 3"></path><path d="M3 8v5.5h10V8"></path></svg>
      <span id="share-text"></span>
    </button>

    <section class="list">
      <span class="category" data-i18n="yourHabits"></span>
      <div class="list" id="habits"></div>
    </section>

    <section class="tip">
      <span class="category" data-i18n="tipOfTheWeek"></span>
      <p id="weekly-tip"></p>
    </section>

    <div class="footer">
      <span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>
        <span data-i18n="nothingLeaves"></span>
      </span>
      <button class="link" id="data-button" type="button" aria-expanded="false" aria-controls="data" data-i18n="yourData"></button>
    </div>

    <div class="data" id="data" hidden>
      <p data-i18n="dataExplain"></p>
      <div>
        <button class="secondary" id="export" type="button" data-i18n="export"></button>
        <button class="secondary" id="clear" type="button" data-i18n="clearAll"></button>
      </div>
    </div>

    <script src="dome.js"></script>
    <script src="grade.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
