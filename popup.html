<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>optidome</title>
    <style>
      /* Onest, the website's font, served by the extension (OFL, fonts/OFL-onest.txt). */
      @font-face {
        font-family: "Onest";
        font-weight: 100 900;
        font-display: swap;
        src: url("fonts/onest-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Onest";
        font-weight: 100 900;
        font-display: swap;
        src: url("fonts/onest-latin-ext-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --soft-bg: #f7f7f5;
        --ink: #131312;
        --ink-2: #2e2d2a;
        --muted: #5a5955;
        --line: #ecebe8;
        --line-strong: #d9d8d3;
        --badge: #fff1e6;
        --icon: #b54d00;
        --button: #131312;
        --button-text: #ffffff;
        --danger: #a3271f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1d;
          --soft-bg: #26262a;
          --ink: #ecebe8;
          --ink-2: #d6d5cf;
          --muted: #a9a8a2;
          --line: #38383e;
          --line-strong: #45454c;
          --badge: rgba(255, 109, 0, 0.16);
          --icon: #ff9a4d;
          --button: #ffffff;
          --button-text: #131312;
          --danger: #ff8a80;
        }
      }
      body {
        width: 380px;
        margin: 0;
        padding: 16px 18px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font: 13.5px/1.5 "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      [hidden] { display: none !important; }
      button, select { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid #ff6d00; outline-offset: 2px; }
      main { display: flex; flex-direction: column; gap: 14px; }
      .header { display: flex; align-items: center; gap: 8px; }
      .brand { flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
      .month { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--soft-bg); border: 0; padding: 5px 8px; border-radius: 999px; }
      .icon-button { width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
      .category { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      section { display: flex; flex-direction: column; gap: 8px; }
      p { margin: 0; }
      .todo { border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; display: flex; flex-direction: column; gap: 6px; }
      .todo strong { font-size: 13.5px; font-weight: 600; }
      .todo p, .empty { font-size: 12.5px; color: var(--ink-2); }
      .empty { color: var(--muted); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .primary { border: 0; background: var(--button); color: var(--button-text); font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; }
      .secondary { border: 1px solid var(--line-strong); background: transparent; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; }
      .habit { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
      .habit span { flex-grow: 1; }
      .habit .check { flex-grow: 0; width: 18px; height: 18px; border-radius: 999px; background: #ff6d00; color: #131312; display: grid; place-items: center; }
      .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .figures div { background: var(--soft-bg); border-radius: 10px; padding: 8px 10px; }
      .figures strong { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .figures span { font-size: 11px; color: var(--muted); }
      .cost { font-size: 12px; color: var(--ink-2); }
      details { font-size: 12px; color: var(--muted); }
      summary { color: var(--icon); font-weight: 500; cursor: pointer; }
      details p { margin-top: 6px; }
      .tip { background: var(--soft-bg); border-radius: 12px; padding: 12px 13px; font-size: 12.5px; color: var(--ink-2); }
      .footer { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
      .back { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; }
      h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      .switch { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
      .switch strong { display: block; font-size: 13px; font-weight: 600; }
      .switch small { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
      .switch input { appearance: none; flex-shrink: 0; width: 34px; height: 20px; margin: 2px 0 0; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; }
      .switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 0.15s; }
      .switch input:checked { background: var(--button); }
      .switch input:checked::after { left: 17px; background: var(--button-text); }
      .danger { color: var(--danger); }
      .small { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main id="home">
      <div class="header">
        <svg width="22" height="22" class="logo" aria-hidden="true"></svg>
        <span class="brand">optidome</span>
        <select class="month" id="month" data-i18n-label="monthLabel"></select>
        <button class="icon-button" id="open-settings" type="button" data-i18n-label="settings">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"></path><circle cx="11" cy="4.5" r="1.5"></circle><circle cx="5" cy="11.5" r="1.5"></circle></svg>
        </button>
      </div>

      <section id="todo-section">
        <span class="category" data-i18n="todoNow"></span>
        <div class="todo" id="todo-long" hidden>
          <strong data-i18n="todoLongTitle"></strong>
          <p id="todo-long-text"></p>
          <div class="row"><button class="primary" id="todo-long-open" type="button" data-i18n="todoLongOpen"></button></div>
        </div>
        <div class="todo" id="todo-mode" hidden>
          <strong data-i18n="todoModeTitle"></strong>
          <p id="todo-mode-text"></p>
          <div class="row"><button class="secondary" id="todo-mode-ok" type="button" data-i18n="gotIt"></button></div>
        </div>
        <p class="empty" id="todo-empty" data-i18n="todoEmpty" hidden></p>
      </section>

      <section>
        <span class="category" id="habits-title"></span>
        <div id="habits"></div>
      </section>

      <section>
        <span class="category" id="figures-title"></span>
        <div class="figures">
          <div><strong id="messages">0</strong><span id="messages-label"></span></div>
          <div><strong id="conversations">0</strong><span id="conversations-label"></span></div>
          <div><strong id="assistants">0</strong><span id="assistants-label"></span></div>
        </div>
        <p class="cost" id="cost" hidden></p>
        <details id="calc" hidden>
          <summary data-i18n="howCalculated"></summary>
          <p id="calc-text"></p>
        </details>
      </section>

      <section class="tip">
        <span class="category" data-i18n="tipOfTheWeek"></span>
        <p id="weekly-tip"></p>
      </section>

      <div class="footer">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>
        <span data-i18n="nothingLeaves"></span>
      </div>
    </main>

    <main id="settings" hidden>
      <button class="back" id="close-settings" type="button" data-i18n="back"></button>
      <h1 data-i18n="settings"></h1>
      <div>
        <label class="switch">
          <span><strong data-i18n="privacyAlerts"></strong><small data-i18n="privacyAlertsText"></small></span>
          <input type="checkbox" id="privacy-alerts" />
        </label>
        <label class="switch">
          <span><strong data-i18n="tipsSwitch"></strong><small data-i18n="tipsSwitchText"></small></span>
          <input type="checkbox" id="tips" />
        </label>
        <label class="switch">
          <span><strong data-i18n="testMode"></strong><small data-i18n="testModeText"></small></span>
          <input type="checkbox" id="test-mode" />
        </label>
      </div>
      <section>
        <p class="small" data-i18n="dataExplain"></p>
        <div class="row">
          <button class="secondary" id="export" type="button" data-i18n="export"></button>
          <button class="secondary danger" id="clear" type="button" data-i18n="clearAll"></button>
        </div>
        <p class="small" id="clear-confirm" data-i18n="clearConfirm" hidden></p>
      </section>
    </main>

    <script src="dome.js"></script>
    <script src="usage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
