name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # The package for the Chrome Web Store: what Chrome loads, nothing else.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir dist
          zip -r "dist/optidome-companion-$version.zip" \
            manifest.json popup.html LICENSE _locales icons fonts \
            $(ls *.js | grep -v '\.check\.js$')
          unzip -l "dist/optidome-companion-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: optidome-companion-${{ env.VERSION }}
          path: dist/*.zip
